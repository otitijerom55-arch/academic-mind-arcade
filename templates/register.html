{% extends "layout.html" %}
{% block title %}Account Registration | {{ meta.brand_name }}{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-6 py-16">
    <div class="cyber-card rounded-3xl p-8 border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-white tracking-wider font-cyber">CREATE ACCOUNT</h1>
            <p class="text-xs font-bold text-cyan-400 uppercase tracking-widest mt-1">Unlock Multi-Level Curriculum</p>
        </div>

        <form action="/register" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Student Email Address</label>
                <input type="email" name="email" required placeholder="student@academicmindarcade.com" class="w-full cyber-input text-white rounded-xl px-4 py-3 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Create Password</label>
                <input type="password" name="password" required placeholder="••••••••••••••••" class="w-full cyber-input text-white rounded-xl px-4 py-3 text-sm">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-cyan-400 to-teal-300 text-slate-950 font-black tracking-wider uppercase rounded-xl hover:opacity-90 transition font-cyber shadow-lg shadow-cyan-500/20">
                Complete Registration ➔
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
            Already registered? <a href="/login" class="text-cyan-400 hover:underline">Sign In</a>
        </div>
    </div>
</main>
{% endblock %}
