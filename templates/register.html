{% extends "layout.html" %}
{% block title %}Create Student Account | {{ meta.brand_name }}{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-4 sm:px-6 py-14">
    <div class="cyber-card rounded-3xl p-8 border border-slate-800 shadow-2xl relative z-10 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-950/80 border border-indigo-800/80 text-indigo-400 mx-auto flex items-center justify-center font-bold text-xl font-cyber shadow-lg shadow-indigo-500/20">
                ⚛
            </div>
            <h1 class="text-2xl font-black text-white tracking-wider font-cyber">STUDENT REGISTRATION</h1>
            <p class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Join Math & Physics Learning Hub</p>
        </div>

        <form action="/register" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
                <input type="text" name="name" required placeholder="Isaac Newton" class="w-full cyber-input text-white rounded-xl px-4 py-3">
            </div>

            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                <input type="email" name="email" required placeholder="scholar@stem.edu" class="w-full cyber-input text-white rounded-xl px-4 py-3 font-mono">
            </div>

            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password Access Key</label>
                <input type="password" name="password" required placeholder="••••••••••••••••" class="w-full cyber-input text-white rounded-xl px-4 py-3">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-cyan-400 via-teal-300 to-indigo-400 text-slate-950 font-black tracking-wider uppercase rounded-xl hover:opacity-90 transition font-cyber shadow-lg shadow-cyan-500/20 text-xs">
                Unlock Learning Arcades ➔
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800/80 text-center flex justify-between items-center text-xs text-slate-400">
            <a href="/login" class="hover:text-cyan-400 transition">Already registered? Sign In</a>
            <a href="/intellectual-property" class="hover:text-indigo-400 transition">IP Legal Framework</a>
        </div>
    </div>
</main>
{% endblock %}
