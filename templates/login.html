{% extends "layout.html" %}
{% block title %}Authentication Terminal | {{ meta.brand_name }}{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-6 py-16">
    <div class="cyber-card rounded-3xl p-8 border border-slate-800 shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-white tracking-wider font-cyber">SYSTEM AUTHENTICATION</h1>
            <p class="text-xs font-bold text-indigo-400 uppercase tracking-widest mt-1">Academic Mind Arcade™ Security Gateway</p>
        </div>

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">User / Admin Email</label>
                <input type="email" name="email" required placeholder="otitijerom55@gmail.com" class="w-full cyber-input text-white rounded-xl px-4 py-3 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Password Access Key</label>
                <input type="password" name="password" required placeholder="••••••••••••••••" class="w-full cyber-input text-white rounded-xl px-4 py-3 text-sm">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 via-cyan-500 to-teal-400 text-slate-950 font-black tracking-wider uppercase rounded-xl hover:opacity-90 transition font-cyber shadow-lg shadow-cyan-500/20">
                Authorize Session ➔
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800/80 text-center flex justify-between items-center text-xs text-slate-400">
            <a href="/register" class="hover:text-cyan-400 transition">Create Student Account</a>
            <a href="/intellectual-property" class="hover:text-indigo-400 transition">IP Legal Rights Notice</a>
        </div>
    </div>
</main>
{% endblock %}
