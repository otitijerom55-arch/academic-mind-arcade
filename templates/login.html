{% extends "layout.html" %}
{% block title %}Student & Staff Sign In | {{ meta.brand_name }}{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-4 sm:px-6 py-14">
    <div class="cyber-card rounded-3xl p-8 border border-slate-800 shadow-2xl relative z-10 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-cyan-950/80 border border-cyan-800/80 text-cyan-400 mx-auto flex items-center justify-center font-bold text-xl font-cyber shadow-lg shadow-cyan-500/20">
                ∑
            </div>
            <h1 class="text-2xl font-black text-white tracking-wider font-cyber">STUDENT PORTAL</h1>
            <p class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Academic Mind Arcade™ Gateway</p>
        </div>

        <form action="/login" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-400 mb-1.5">User / Admin Email</label>
                <input type="email" name="email" required placeholder="student@example.com" class="w-full cyber-input text-white rounded-xl px-4 py-3 font-mono">
            </div>

            <div>
                <label class="block font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password Access Key</label>
                <input type="password" name="password" required placeholder="••••••••••••••••" class="w-full cyber-input text-white rounded-xl px-4 py-3">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 via-cyan-500 to-teal-400 text-slate-950 font-black tracking-wider uppercase rounded-xl hover:opacity-90 transition font-cyber shadow-lg shadow-cyan-500/20 text-xs">
                Authorize Session ➔
            </button>
        </form>

        <div class="pt-4 border-t border-slate-800/80 text-center flex justify-between items-center text-xs text-slate-400">
            <a href="/register" class="hover:text-cyan-400 transition">Create Student Account</a>
            <a href="/about" class="hover:text-indigo-400 transition">About System</a>
        </div>
    </div>
</main>
{% endblock %}
