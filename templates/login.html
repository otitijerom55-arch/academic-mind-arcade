<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Academic Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200 dark:border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-6">Student Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border dark:border-slate-600 rounded-lg dark:bg-slate-700 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold uppercase">Password</label>
                    <a href="/forgot-password" class="text-xs text-indigo-600 hover:underline font-medium">Forgot Password?</a>
                </div>
                <input type="password" name="password" required class="w-full px-4 py-2 border dark:border-slate-600 rounded-lg dark:bg-slate-700 focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">Log In</button>
        </form>

        <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
            Don't have an account? <a href="/register" class="text-indigo-600 font-semibold hover:underline">Register here</a>
        </p>
    </div>
</body>
</html>
